name: ci

on:
  push:
    branches: [trunk]
    tags: ['v*']
  # No branches filter on pull_request: sprint PRs stack (each based on the
  # previous), and a base filter would silently skip CI on stacked PRs.
  pull_request:

jobs:
  # The escape hatches are policy, not performance measurements.  Audit them
  # even when a valid docs-only [bench skip] suppresses the expensive jobs.
  perf-policy:
    runs-on: ubuntu-latest
    outputs:
      bench_skip: ${{ steps.policy.outputs.bench_skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: policy
        name: audit performance escape hatches and gate inventory
        env:
          CGF_PERF_VERIFY_ISSUES: 1
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_EVENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          scripts/check_bench_policy.sh --commit "$GITHUB_EVENT_COMMIT"
          scripts/check_perf_configs.sh
          if git show -s --format=%B "$GITHUB_EVENT_COMMIT" | grep -Fq '[bench skip]'; then
            echo 'bench_skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bench_skip=false' >> "$GITHUB_OUTPUT"
          fi

  # Release reports are reviewed and committed before a tag is created.
  # Tag CI regenerates the matching report and rejects absence or drift.
  perf-report-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: verify the committed release performance report
        run: |
          version=${GITHUB_REF_NAME#v}
          report=.benchmarks/report-$version.md
          git ls-files --error-unmatch "$report"
          make PERF_REPORT_VERSION="$version" PERF_REPORT="$report" perf-report
          git diff --exit-code -- "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

  build-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make CC=gcc

  build-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make CC=clang

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make CC=gcc test

  # Sprint 49 DoD 7 / Sprint 48 DoD 6: arm64-linux on REAL arm64 hardware.
  # The compiler's own `cgf_target_host()` selects the arm64 backend -- there
  # is no --target flag until Sprint 51, so the compiler's architecture IS
  # the target, and a native runner is the only way to exercise it without
  # emulation.
  #
  # Deliberately NOT `make test`: that suite has x86-pinned lanes (the object
  # differential, the atomics lane, the MIR goldens) which need target guards
  # before they can run here. Making them target-aware is Sprint 51's
  # cross-and-differential work. What this job proves is the milestone and
  # the corpus, which is what DoD 2 asks for.
  test-arm64-native:
    needs: perf-policy
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The arm64 runner image is leaner than ubuntu-latest and ships no
      # assembler, so `cgf hello.c` fails with "assembler not found" before
      # it reaches any codegen. libc6-dev supplies crt1.o and the headers.
      - name: install the assembler, linker and libc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils libc6-dev
      # `rt` is not optional here: arm64's long double is binary128 and every
      # operation on it is a call into libcgf_rt, so without the archive the
      # corpus's long-double programs fail to link on __addtf3. On a native
      # host RT_TARGET resolves by running the compiler just built.
      - name: build
        run: make CC=gcc -j"$(nproc)" build/cgfried build/cgf build/cgf-test build/timeit rt
      - name: "arm64-hello-world: THE milestone"
        run: |
          printf 'int printf(const char *, ...);\nint main(void) { printf("hello, world\\n"); return 0; }\n' > hello.c
          # CGF_AS=0: the default assembler is the BUNDLED afs-as, which this
          # Rust-free job does not build. -v on failure, because the probe
          # diagnostics name every path they tried.
          export CGF_AS=0
          ./build/cgf hello.c -o hello || { ./build/cgf -v hello.c -o hello; exit 1; }
          ./hello
      - name: e2e corpus, natively (exact failure ledger)
        run: |
          s=0
          CGF_A64_CGF=build/cgfried sh scripts/a64_corpus_lane.sh "" build/cgf-test \
            > a64native.log 2>&1 || s=$?
          cat a64native.log
          [ "$s" -eq 0 ]
          ! grep -q "skipped" a64native.log
      # DoD 4. The char-sign fixtures carry one expectation per arch and are
      # the only ones that assert the target's char signedness; until now the
      # arm64 half was oracle-verified against gcc but had never EXECUTED on
      # arm64. Same lane, different corpus directory.
      - name: char-sign corpus, natively
        run: |
          s=0
          CGF_A64_CGF=build/cgfried \
          CGF_A64_CORPUS_DIR=tests/corpus/char_sign \
          CGF_A64_CORPUS_WORK=build/a64-char-sign \
          CGF_A64_LEDGER=/dev/null \
            sh scripts/a64_corpus_lane.sh "" build/cgf-test > a64cs.log 2>&1 || s=$?
          cat a64cs.log
          [ "$s" -eq 0 ]
          ! grep -q "skipped" a64cs.log
      # DoD 6. qemu-user does not reproduce weak memory ordering and its
      # scheduling is far tamer than a real core's, so the four-thread ll/sc
      # hammer only counts here. The lane picks native tool names on an arm64
      # host and executes through qemu-run.sh, which is a passthrough.
      - name: atomics hammer and exec fixtures, natively
        run: |
          make CC=gcc -j"$(nproc)" build/a64mir
          s=0
          sh scripts/a64_exec_lane.sh build/a64mir > a64exec.log 2>&1 || s=$?
          cat a64exec.log
          [ "$s" -eq 0 ]
          ! grep -q "skipped" a64exec.log
      - name: Sprint 54 native ARM RSS, size, static gates, and summary
        if: needs.perf-policy.outputs.bench_skip != 'true'
        run: |
          status=0
          CGF_BENCH_FORCE=1 CGF_BENCH_SKIP_MUSL=1 \
            CGF_BENCH_HOST_CLASS=arm64-ci BENCH_SKIP_TIME=1 \
            BENCH_BASELINE=.benchmarks/baseline-arm64-linux.ci.txt \
            BENCH_RESULTS=build/bench/results-arm64-linux.txt \
            make CC=gcc bench-gate || status=$?
          size_static_status=0
          CGF_SIZE_HOST_CLASS=arm64-ci make CC=gcc perf-arm64 || \
            size_static_status=$?
          if [ "$status" -eq 0 ]; then status=$size_static_status; fi
          summary_status=0
          BENCH_BASELINE=.benchmarks/baseline-arm64-linux.ci.txt \
            BENCH_RESULTS=build/bench/results-arm64-linux.txt \
            make perf-summary-arm64 || summary_status=$?
          if [ "$status" -eq 0 ]; then status=$summary_status; fi
          for result in build/bench/results-arm64-linux.txt \
              build/bench/size-arm64-linux.txt \
              build/bench/kernels-arm64-linux.txt; do
            if [ -r "$result" ]; then cat "$result"; fi
          done
          exit "$status"
      - name: retain native ARM performance evidence
        if: always() && needs.perf-policy.outputs.bench_skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sprint54-perf-arm64-linux
          path: |
            build/bench/results-arm64-linux.txt
            build/bench/size-arm64-linux.txt
            build/bench/kernels-arm64-linux.txt
          if-no-files-found: error
          retention-days: 90

  # ...and the cross lane, which is what a developer on an x86 box gets.
  # Two levels of emulation: an arm64 cgfried under qemu-user building
  # programs that also run under qemu-user. Its failure ledger is exact, so
  # a regression and a repair both fail it.
  test-arm64-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install the cross toolchain and emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu qemu-user-static
      - name: e2e corpus on arm64 under qemu (exact failure ledger)
        run: |
          make -j"$(nproc)" build/cgf-test
          s=0
          make test-a64-corpus > a64corpus.log 2>&1 || s=$?
          cat a64corpus.log
          [ "$s" -eq 0 ]
          ! grep -q "skipped" a64corpus.log
      # The same corpus with every interval forced to memory, against its own
      # ledger. The spill rewrite moves instruction indices and natural
      # pressure barely reaches it; this lane found eleven failures the
      # ordinary one does not see.
      - name: e2e corpus under CGF_SPILL_ALL (exact failure ledger)
        run: |
          s=0
          make test-a64-spill-all > a64spill.log 2>&1 || s=$?
          cat a64spill.log
          [ "$s" -eq 0 ]
          ! grep -q "skipped" a64spill.log
      - name: char-sign corpus under qemu
        run: |
          s=0
          make test-a64-char-sign > a64cs.log 2>&1 || s=$?
          cat a64cs.log
          [ "$s" -eq 0 ]
          ! grep -q "skipped" a64cs.log
      # Sprint 51 D6 at PR scale. `make test` runs 24 seeds on x86_64 only,
      # because that is what fits its budget; this is where arm64 gets
      # covered and where the count is large enough to reach the cliff
      # shapes. Both directions, and the checked-in reproducers first.
      # A HARNESS_SKIP here would mean the cross toolchain vanished, so it
      # is a failure rather than a pass.
      - name: ABI differential, both arches, 250 signatures each
        run: |
          make -j"$(nproc)" all build/abigen
          s=0
          for t in x86_64-linux-gnu arm64-linux; do
            CGF_ABI_DIFF_TARGET=$t CGF_ABI_DIFF_COUNT=250 \
              CGF_ABI_DIFF_WORK=build/abi-$t \
              sh scripts/abi_differential_lane.sh build/cgfried \
              > "abi-$t.log" 2>&1 || s=1
            cat "abi-$t.log"
            if grep -q HARNESS_SKIP "abi-$t.log"; then
              echo "the cross toolchain went missing; a skip here is a failure"
              s=1
            fi
          done
          [ "$s" -eq 0 ]

  test-san:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make CC=gcc test-san

  # Shared runners are too noisy for timing truth. RSS, binary size, and the
  # deterministic kernel proxies do gate or record trial trips here.
  bench-rss:
    needs: perf-policy
    if: needs.perf-policy.outputs.bench_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: build, measure, gate, and publish the x86 perf summary
        run: |
          status=0
          CGF_BENCH_FORCE=1 CGF_BENCH_SKIP_MUSL=1 \
            CGF_BENCH_HOST_CLASS=ci BENCH_SKIP_TIME=1 \
            make CC=gcc bench-gate || status=$?
          size_static_status=0
          CGF_SIZE_HOST_CLASS=ci make CC=gcc perf-x86 || \
            size_static_status=$?
          if [ "$status" -eq 0 ]; then status=$size_static_status; fi
          summary_status=0
          make perf-summary-x86 || summary_status=$?
          if [ "$status" -eq 0 ]; then status=$summary_status; fi
          exit "$status"
      - name: retain x86 performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprint54-perf-x86_64-linux-gnu
          path: |
            build/bench/results.txt
            build/bench/size-x86_64-linux-gnu.txt
            build/bench/kernels-x86_64-linux-gnu.txt
          if-no-files-found: error
          retention-days: 90
      - name: prove timing skip and RSS enforcement
        run: |
          BENCH_SKIP_TIME=1 scripts/benchmark_gate.sh \
            tests/bench/fixtures/gate/baseline.txt \
            tests/bench/fixtures/gate/skip-time.txt
          s=0
          BENCH_SKIP_TIME=1 scripts/benchmark_gate.sh \
            tests/bench/fixtures/gate/baseline.txt \
            tests/bench/fixtures/gate/fail-rss-21.txt || s=$?
          [ "$s" -eq 1 ] || {
            echo "seeded RSS regression returned $s, expected 1" >&2
            exit 1
          }
      - name: prove the Sprint 54 size boundary in CI
        run: |
          scripts/size_gate.sh --gate \
            tests/scripts/gates/fixtures/size/baseline.txt \
            tests/scripts/gates/fixtures/size/pass-14.txt
          s=0
          scripts/size_gate.sh --gate \
            tests/scripts/gates/fixtures/size/baseline.txt \
            tests/scripts/gates/fixtures/size/fail-16.txt || s=$?
          [ "$s" -eq 1 ] || {
            echo "seeded +16% size regression returned $s, expected 1" >&2
            exit 1
          }

  memsafe-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make CC=gcc test-memsafe-foundation

  # Sprint 46: the compiler itself must remain inside the -fsafe profile.
  # The allowlist is a shrink-only reviewed upper bound.
  safe-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make CC=gcc safe-dogfood

  # Sprint 42's credibility gate: the default memory-warning tier must stay
  # silent over every musl TU that reaches analysis IR.  Both the upstream
  # commit and the analyzed/deferred coverage split are pinned.
  memsafe-musl-zero-fp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # git.musl-libc.org is a single upstream host and has timed out twice in
      # one night, failing a gate that has nothing to do with the network.
      # The corpus is pinned to an exact commit, so caching it is safe: the
      # key IS the pin, and a different pin cannot hit a stale entry.
      - name: cache the pinned musl corpus
        id: musl-cache
        uses: actions/cache@v5
        with:
          path: .docs/refs/musl
          key: musl-b306b16af15c89a04d8e0c55cac2dadbeb39c083
      - name: fetch pinned musl corpus
        if: steps.musl-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            rm -rf .docs/refs/musl
            git clone --filter=blob:none \
              https://git.musl-libc.org/git/musl .docs/refs/musl && break
            echo "clone attempt $i failed; retrying" >&2
            sleep 15
          done
          git -C .docs/refs/musl checkout b306b16af15c89a04d8e0c55cac2dadbeb39c083
      # Unconditional, and deliberately its own step: a cache hit must be
      # checked against the pin too, or a poisoned entry would go unexamined.
      - name: verify the musl pin
        run: |
          test "$(git -C .docs/refs/musl rev-parse HEAD)" = b306b16af15c89a04d8e0c55cac2dadbeb39c083
      - run: make CC=gcc musl-sweep

  # Sprint 38's compatibility gate uses the actual GCC 8 diagnostic oracle.
  # Local runs may skip when gcc-8 is unavailable; CI may not.
  warn-diff-gcc8:
    runs-on: ubuntu-latest
    container: gcc:8
    steps:
      - uses: actions/checkout@v5
      - run: make BUILD=build-gcc8-diff test-warndiff

  # 100k fixed-seed iterations under ASan+UBSan. Fixed seed, not random:
  # a red CI run must be reproducible from the log alone, and a nightly
  # job (Sprint 37 adds it) is the right place for wider seeds.
  fuzz-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build with sanitizers
        run: |
          make BUILD=build-san \
            EXTRA_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
            build-san/cgfried build-san/fuzz_frontend
      - name: fuzz
        run: |
          build-san/fuzz_frontend --iters 100000 --seed 1 \
            build-san/cgfried tests/fixtures tests/programs
      - name: no unfixed findings
        run: sh scripts/check_fuzz_crashes.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned major from scripts/check_format.sh, installed via apt.llvm.org
      # (ubuntu's own repos lag behind the pin).
      - name: install pinned clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y clang-format-22
      - run: CGF_FORMAT_REQUIRED=1 sh scripts/check_format.sh

  # The only Rust-touching job — the compiler jobs above stay Rust-free,
  # which is the proof of the "Rust for tools only" dependency claim.
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install authoritative AArch64 assembler oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: submodules (https mirror of the SSH URLs)
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1
      - uses: dtolnay/rust-toolchain@stable
      - name: cache cargo + tool targets
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            afs-as/target
            afs-ld/target
          key: tools-v1-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            tools-v1-${{ hashFiles('.gitmodules') }}-
            tools-v1-
      - run: make tools
      - name: AArch64 assembler differential (both required, zero skips)
        run: |
          command -v aarch64-linux-gnu-as
          make test-a64-asm-diff
      # Sprint 49 DoD 1. This is the only job with BOTH assemblers, so it is
      # the only place the arm64 object differential can be required rather
      # than allowed to skip. A skip line here is a failure.
      - name: AArch64 object differential (afs-as ELF vs gas, zero skips)
        run: |
          make -j"$(nproc)" build/a64mir
          s=0
          sh scripts/a64_objdiff_lane.sh build/a64mir > a64objdiff.log 2>&1 || s=$?
          cat a64objdiff.log
          [ "$s" -eq 0 ]
          ! grep -q "skipped" a64objdiff.log
      - name: smoke differential (afs-as vs gas, section bytes)
        run: |
          s=0
          sh scripts/toolchain_smoke.sh > toolchain.log 2>&1 || s=$?
          cat toolchain.log
          [ "$s" -eq 0 ]
          sh ci/check_skips.sh toolchain toolchain.log
      - name: "x86_64-hello-world: THE milestone (Sprint 25)"
        run: |
          # The corpus includes _Float128 operations lowered to libcgf_rt.
          make -j"$(nproc)" build/cgfried build/cgf build/cgf-test rt
          printf 'int printf(const char *, ...);\nint main(void) { printf("hello, world\\n"); return 0; }\n' > hello.c
          ./build/cgf hello.c -o hello
          ./hello
          echo "hello exit: $?"
          # full corpus, three lanes: bundled afs-as, system gas, spill-all
          CGF_TEST_CC=build/cgfried build/cgf-test --profile linux-x86_64 tests/corpus
          CGF_AS=0 CGF_TEST_CC=build/cgfried build/cgf-test --profile linux-x86_64 tests/corpus
          CGF_SPILL_ALL=1 CGF_TEST_CC=build/cgfried build/cgf-test --profile linux-x86_64 tests/corpus
          sh scripts/e2e_gcc_diff.sh build/cgfried
      - name: emission differential (Sprint 24, BOTH assembler lanes)
        run: |
          make -j"$(nproc)" build/cgfried build/cgf build/cgf-objdiff
          # -e-safe capture: the log must PRINT even when the lane fails
          if sh scripts/objdiff_lane.sh build/cgfried build/cgf-objdiff \
              > objdiff.log 2>&1; then s=0; else s=1; fi
          cat objdiff.log
          [ "$s" -eq 0 ]
          sh ci/check_skips.sh objdiff objdiff.log
      - name: "afs-ld static lane (Sprint 27: CGF_LD=1 corpus + structure)"
        run: |
          make -j"$(nproc)" build/cgfried build/cgf-test
          if sh scripts/afsld_lane.sh build/cgfried \
              > afsld.log 2>&1; then s=0; else s=1; fi
          cat afsld.log
          [ "$s" -eq 0 ]
          sh ci/check_skips.sh afsld afsld.log
      - name: "DWARF v4 + CFI debugger lane (Sprint 29)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          make -j"$(nproc)" build/cgfried
          if CGF_DEBUG_WORK=build/debug-info-toolchain \
              sh scripts/debug_info_lane.sh build/cgfried \
              > debug-info.log 2>&1; then s=0; else s=1; fi
          cat debug-info.log
          [ "$s" -eq 0 ]
          sh ci/check_skips.sh debug debug-info.log

  # Sprint 50 D6: arm64 Darwin. The ABI programs and the Mach-O object
  # differential both need a real Mac -- an ABI bug that clang and cgfried
  # share is invisible, and the differential compares our assembler against
  # Apple's. Both lanes skip loudly off arm64 Darwin, so this runner is the
  # only place they actually execute.
  #
  # Hosted programs are NOT compiled here: Apple's headers use __attribute__
  # unconditionally and __DARWIN_ALIAS needs asm labels, both Sprint 55.
  # Everything below is freestanding by construction.
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: submodules (https mirror of the SSH URLs)
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1
      - uses: dtolnay/rust-toolchain@stable
      - name: cache cargo + tool targets
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            afs-as/target
            afs-ld/target
          key: macos-tools-v1-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            macos-tools-v1-${{ hashFiles('.gitmodules') }}-
            macos-tools-v1-
      - run: make tools
      - run: make -j3 build/cgfried build/timeit build/timeit-math-test
      - name: Sprint 52 timer profile
        run: |
          sh tests/bench/timeit_test.sh build/timeit
          build/timeit-math-test
      - name: the target must actually be arm64-macos
        run: |
          got=$(./build/cgfried -dumpmachine)
          test "$got" = arm64-macos || {
            echo "runner produced $got, not arm64-macos" >&2
            exit 1
          }
      - name: ABI programs, both linkers, signatures checked
        run: |
          sh tests/macos/run.sh build/cgfried > macos-lane.log 2>&1 || s=$?
          cat macos-lane.log
          [ "${s:-0}" -eq 0 ]
          # The lane skips loudly off arm64 Darwin. On this runner a skip
          # means it did not run, which must fail rather than read as green.
          ! grep -q HARNESS_SKIP macos-lane.log
      - name: Mach-O object differential vs Apple's assembler
        run: |
          sh scripts/macho_objdiff_lane.sh build/cgfried > macho-objdiff.log 2>&1 || s=$?
          cat macho-objdiff.log
          [ "${s:-0}" -eq 0 ]
          ! grep -q HARNESS_SKIP macho-objdiff.log
