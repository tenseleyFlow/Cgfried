name: torture-nightly

permissions:
  contents: read

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  arm64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: install the native assembler, linker, and libc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils libc6-dev
      - name: build the compiler and runtime
        run: make CC=gcc -j"$(nproc)" all
      - name: verify pristine imports and run the native arm64 matrix gate
        run: |
          CGF_TORTURE_TARGET=arm64-linux \
            make torture-gate
      - name: retain the classified matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprint56-torture-arm64-linux
          path: build/torture/results-arm64-linux-v2.txt
          if-no-files-found: warn
          retention-days: 30

  campaign-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: cache pinned musl and libc-test inputs
        id: musl-cache
        uses: actions/cache@v5
        with:
          path: |
            .docs/refs/musl
            .docs/refs/libc-test
          key: nightly-campaign-musl-b306b16af15c89a04d8e0c55cac2dadbeb39c083-libc-test-123433158bf985d7eb3b4072e32121b9e32a1a1a
      - name: cache the pinned Sprint 59 static-lane archives
        uses: actions/cache@v5
        with:
          path: build/campaigns/dl
          key: nightly-campaign-musl-s59-static-${{ hashFiles('ci/campaigns/zlib.mk', 'ci/campaigns/lua.mk') }}
      - name: fetch pinned inputs
        if: steps.musl-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .docs/refs/musl .docs/refs/libc-test
          mkdir -p .docs/refs
          git init .docs/refs/musl
          git -C .docs/refs/musl remote add origin https://git.musl-libc.org/git/musl
          git -C .docs/refs/musl fetch --depth=1 origin b306b16af15c89a04d8e0c55cac2dadbeb39c083
          git -C .docs/refs/musl checkout --detach FETCH_HEAD
          git init .docs/refs/libc-test
          git -C .docs/refs/libc-test remote add origin https://repo.or.cz/libc-test.git
          git -C .docs/refs/libc-test fetch --depth=1 origin 123433158bf985d7eb3b4072e32121b9e32a1a1a
          git -C .docs/refs/libc-test checkout --detach FETCH_HEAD
      - name: verify both pins
        run: |
          test "$(git -C .docs/refs/musl rev-parse HEAD)" = b306b16af15c89a04d8e0c55cac2dadbeb39c083
          test "$(git -C .docs/refs/libc-test rev-parse HEAD)" = 123433158bf985d7eb3b4072e32121b9e32a1a1a
      - name: run campaign
        run: |
          make CC=gcc -j"$(nproc)" all
          make campaign-musl
          make campaign-zlib-fetch campaign-lua-fetch
          CGF_CAMPAIGN_OFFLINE=1 \
          CGF_CAMPAIGN_ZLIB_TARGET=x86_64-linux-musl \
          CGF_CAMPAIGN_ZLIB_SYSROOT=build/campaigns/musl/cgf-a/install \
          CGF_CAMPAIGN_ZLIB_WORK=build/campaigns/zlib-musl \
            make zlib-expected
          CGF_CAMPAIGN_OFFLINE=1 make lua-musl-expected
      - name: capture exact campaign results for the isolated ledger reporter
        if: always()
        run: |
          scripts/campaign-capture-result.sh musl musl-x86_64 \
            ci/campaigns/musl.expected build/campaigns/musl/results.txt
          scripts/campaign-capture-result.sh zlib zlib-musl-x86_64 \
            ci/campaigns/zlib.expected build/campaigns/zlib-musl/results.txt
          scripts/campaign-capture-result.sh lua lua-musl-x86_64 \
            ci/campaigns/lua-musl.expected build/campaigns/lua-musl/results.txt
      - name: retain captured campaign results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-results-musl-static-x86_64
          path: build/campaign-reports
          if-no-files-found: error
          retention-days: 30
      - name: retain campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprint57-nightly-musl
          path: |
            build/campaigns/musl/**/results*.txt
            build/campaigns/musl/**/config.mak
            build/campaigns/musl/**/*.log
            build/campaigns/musl/**/logs/**
            build/campaigns/musl/**/routes/**
            build/campaigns/musl/**/failures.txt
            build/campaigns/musl/**/REPORT
            build/campaigns/musl/libc-test-cgf-only.txt
            build/campaigns/zlib-musl/**
            build/campaigns/lua-musl/**
          if-no-files-found: warn
          retention-days: 30

  campaign-chibicc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: cache the pinned chibicc input
        id: chibicc-cache
        uses: actions/cache@v5
        with:
          path: .docs/refs/chibicc
          key: nightly-campaign-chibicc-90d1f7f199cc55b13c7fdb5839d1409806633fdb
      - name: fetch pinned input
        if: steps.chibicc-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .docs/refs/chibicc
          mkdir -p .docs/refs
          git init .docs/refs/chibicc
          git -C .docs/refs/chibicc remote add origin https://github.com/rui314/chibicc
          git -C .docs/refs/chibicc fetch --depth=1 origin 90d1f7f199cc55b13c7fdb5839d1409806633fdb
          git -C .docs/refs/chibicc checkout --detach FETCH_HEAD
      - name: verify the pin
        run: test "$(git -C .docs/refs/chibicc rev-parse HEAD)" = 90d1f7f199cc55b13c7fdb5839d1409806633fdb
      - name: run campaign
        run: |
          make CC=gcc -j"$(nproc)" all
          make campaign-chibicc
      - name: capture exact campaign result
        if: always()
        run: |
          scripts/campaign-capture-result.sh chibicc chibicc-x86_64 \
            ci/campaigns/chibicc.expected build/campaigns/chibicc/results.txt
      - name: retain captured campaign result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-results-chibicc-x86_64
          path: build/campaign-reports
          if-no-files-found: error
          retention-days: 30
      - name: retain campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprint57-nightly-chibicc
          path: |
            build/campaigns/chibicc/results.txt
            build/campaigns/chibicc/source-revision.txt
            build/campaigns/chibicc/logs/**
          if-no-files-found: warn
          retention-days: 30

  campaign-tinycc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: cache the pinned TinyCC input
        id: tinycc-cache
        uses: actions/cache@v5
        with:
          path: .docs/refs/tinycc
          key: nightly-campaign-tinycc-380597704ee9784442ef3c7ef06e105258a11c5d
      - name: fetch pinned input
        if: steps.tinycc-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .docs/refs/tinycc
          mkdir -p .docs/refs
          git init .docs/refs/tinycc
          git -C .docs/refs/tinycc remote add origin https://github.com/TinyCC/tinycc
          git -C .docs/refs/tinycc fetch --depth=1 origin 380597704ee9784442ef3c7ef06e105258a11c5d
          git -C .docs/refs/tinycc checkout --detach FETCH_HEAD
      - name: verify the pin
        run: test "$(git -C .docs/refs/tinycc rev-parse HEAD)" = 380597704ee9784442ef3c7ef06e105258a11c5d
      - name: run campaign
        run: |
          make CC=gcc -j"$(nproc)" all
          make campaign-tinycc
      - name: capture exact campaign result
        if: always()
        run: |
          scripts/campaign-capture-result.sh tinycc tinycc-x86_64 \
            ci/campaigns/tinycc.expected build/campaigns/tinycc/results.txt
      - name: retain captured campaign result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-results-tinycc-x86_64
          path: build/campaign-reports
          if-no-files-found: error
          retention-days: 30
      - name: retain campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprint57-nightly-tinycc
          path: |
            build/campaigns/tinycc/results.txt
            build/campaigns/tinycc/source-revision.txt
            build/campaigns/tinycc/logs/**
            build/campaigns/tinycc/src/config.mak
          if-no-files-found: warn
          retention-days: 30

  # The matrix deliberately includes a real arm64 runner.  QBE's native
  # check executes generated output, so this covers its ARM64 emitter without
  # qemu and also builds Cgfried natively on the architecture.
  campaign-qbe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils libc6-dev
      - name: cache the pinned QBE input
        id: qbe-cache
        uses: actions/cache@v5
        with:
          path: .docs/refs/qbe
          key: nightly-campaign-qbe-${{ matrix.arch }}-d62b154d05de438e12e8b5e980d43ef65ea1bb6c
      - name: fetch pinned input
        if: steps.qbe-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .docs/refs/qbe
          mkdir -p .docs/refs
          git init .docs/refs/qbe
          git -C .docs/refs/qbe remote add origin https://github.com/8l/qbe
          git -C .docs/refs/qbe fetch --depth=1 origin d62b154d05de438e12e8b5e980d43ef65ea1bb6c
          git -C .docs/refs/qbe checkout --detach FETCH_HEAD
      - name: verify the pin
        run: test "$(git -C .docs/refs/qbe rev-parse HEAD)" = d62b154d05de438e12e8b5e980d43ef65ea1bb6c
      - name: run native campaign
        run: |
          make CC=gcc -j"$(nproc)" all
          make campaign-qbe
      - name: capture exact campaign result
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          expected=ci/campaigns/qbe.expected
          if [ "$ARCH" = arm64 ]; then
            expected=ci/campaigns/qbe-arm64.expected
          fi
          scripts/campaign-capture-result.sh qbe "qbe-$ARCH" "$expected" \
            build/campaigns/qbe/results.txt
      - name: retain captured campaign result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-results-qbe-${{ matrix.arch }}
          path: build/campaign-reports
          if-no-files-found: error
          retention-days: 30
      - name: retain campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprint57-nightly-qbe-${{ matrix.arch }}
          path: |
            build/campaigns/qbe/results.txt
            build/campaigns/qbe/source-ref.txt
            build/campaigns/qbe/*.log
            build/campaigns/qbe/*-only-failures.txt
            build/campaigns/qbe/**/config.h
            build/campaigns/qbe/logs/**
          if-no-files-found: warn
          retention-days: 30

  # Sprint 59's four-rung native ladder.  Every project executes on both
  # architectures; the cache-population step is the only network-permitted
  # step, and the closure target is then forced offline.
  campaign-ladder-s59-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: zlib
            runner: ubuntu-latest
            arch: x86_64
          - project: zlib
            runner: ubuntu-24.04-arm
            arch: arm64
          - project: lua
            runner: ubuntu-latest
            arch: x86_64
          - project: lua
            runner: ubuntu-24.04-arm
            arch: arm64
          - project: sqlite
            runner: ubuntu-latest
            arch: x86_64
          - project: sqlite
            runner: ubuntu-24.04-arm
            arch: arm64
          - project: curl
            runner: ubuntu-latest
            arch: x86_64
          - project: curl
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: install native campaign dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils file libc6-dev perl unzip xz-utils
      - name: cache the pinned campaign archive
        uses: actions/cache@v5
        with:
          path: build/campaigns/dl
          key: nightly-campaign-${{ matrix.project }}-${{ matrix.arch }}-${{ hashFiles('ci/campaigns/*.mk') }}
      - name: build the native compiler and populate the verified cache
        run: |
          make CC=gcc -j"$(nproc)" all
          make campaign-${{ matrix.project }}-fetch
      - name: run the native campaign from the offline cache
        run: |
          CGF_CAMPAIGN_OFFLINE=1 make ${{ matrix.project }}-expected
      - name: capture exact campaign result for the isolated ledger reporter
        if: always()
        env:
          PROJECT: ${{ matrix.project }}
          ARCH: ${{ matrix.arch }}
        run: |
          scripts/campaign-capture-result.sh "$PROJECT" "$PROJECT-$ARCH" \
            "ci/campaigns/$PROJECT.expected" \
            "build/campaigns/$PROJECT/results.txt"
      - name: retain captured campaign result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: campaign-results-${{ matrix.project }}-${{ matrix.arch }}
          path: build/campaign-reports
          if-no-files-found: error
          retention-days: 30
      - name: retain campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprint59-nightly-${{ matrix.project }}-${{ matrix.arch }}
          path: |
            build/campaigns/${{ matrix.project }}/**
          if-no-files-found: warn
          retention-days: 30

  # Campaign builds execute pinned third-party code with a read-only token and
  # no persisted checkout credential. This isolated job alone receives issue
  # write authority; it consumes exact captured results and deterministically
  # files or updates one CAMP issue per drifting variant.
  campaign-ledger-report:
    if: always()
    needs:
      - campaign-musl
      - campaign-chibicc
      - campaign-tinycc
      - campaign-qbe
      - campaign-ladder-s59-native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cgfried-campaign-ledger-${{ github.repository_id }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: prepare isolated campaign result roots
        run: |
          mkdir -p build/nightly-campaign-artifacts \
            build/nightly-campaign-results
      # Exact-name downloads always land below their producer envelope. This
      # avoids download-artifact's single-match flattening behavior and keeps
      # producer identity intact for the privileged publisher.
      - name: download static-musl campaign results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-musl-static-x86_64
          path: build/nightly-campaign-artifacts/campaign-results-musl-static-x86_64
      - name: download Chibicc campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-chibicc-x86_64
          path: build/nightly-campaign-artifacts/campaign-results-chibicc-x86_64
      - name: download TinyCC campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-tinycc-x86_64
          path: build/nightly-campaign-artifacts/campaign-results-tinycc-x86_64
      - name: download x86-64 QBE campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-qbe-x86_64
          path: build/nightly-campaign-artifacts/campaign-results-qbe-x86_64
      - name: download ARM64 QBE campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-qbe-arm64
          path: build/nightly-campaign-artifacts/campaign-results-qbe-arm64
      - name: download x86-64 zlib campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-zlib-x86_64
          path: build/nightly-campaign-artifacts/campaign-results-zlib-x86_64
      - name: download ARM64 zlib campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-zlib-arm64
          path: build/nightly-campaign-artifacts/campaign-results-zlib-arm64
      - name: download x86-64 Lua campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-lua-x86_64
          path: build/nightly-campaign-artifacts/campaign-results-lua-x86_64
      - name: download ARM64 Lua campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-lua-arm64
          path: build/nightly-campaign-artifacts/campaign-results-lua-arm64
      - name: download x86-64 SQLite campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-sqlite-x86_64
          path: build/nightly-campaign-artifacts/campaign-results-sqlite-x86_64
      - name: download ARM64 SQLite campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-sqlite-arm64
          path: build/nightly-campaign-artifacts/campaign-results-sqlite-arm64
      - name: download x86-64 curl campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-curl-x86_64
          path: build/nightly-campaign-artifacts/campaign-results-curl-x86_64
      - name: download ARM64 curl campaign result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: campaign-results-curl-arm64
          path: build/nightly-campaign-artifacts/campaign-results-curl-arm64
      - name: file or update every drifting campaign variant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          scripts/campaign-publish-reports.sh \
            build/nightly-campaign-results "$run_url" "$run_url#artifacts" \
            build/nightly-campaign-artifacts
